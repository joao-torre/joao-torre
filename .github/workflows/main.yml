name: Validate GitHub Stats Card

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f README.md
          test -f scripts/generate_card.py
          test -f scripts/card_template.svg
          test -f generated/card.svg
          test -f .github/workflows/update-stats.yml
          echo "Estrutura do projeto OK."
