name: Update GitHub Stats Card

on:
  schedule:
    - cron: "0 6 * * *"   # todo dia às 06:00 UTC (~03:00 em Sorocaba)
  workflow_dispatch: {}    # permite rodar manualmente pela aba Actions
  push:
    branches: [main]

jobs:
  update-card:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Generate card
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_USERNAME: joao-torre
        run: python scripts/generate_card.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add generated/card.svg
          git diff --staged --quiet || git commit -m "chore: atualiza card de stats [skip ci]"
          git push
